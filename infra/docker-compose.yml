services:
  postgres:
    image: postgres:16.4-alpine
    container_name: vertex_postgres_dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vertex_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vertex_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vertex_logistics_dev}
    volumes:
      - vertex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vertex_dev} -d ${POSTGRES_DB:-vertex_logistics_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  vertex_pgdata:
    name: vertex_postgres_data
